<script>
    // ==================== HỆ THỐNG ÂM THANH VUI NHỘN & BẤT NGỜ (WEB AUDIO API) ====================
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-toggle').innerHTML = soundEnabled ? '🔊 Âm thanh: Bật' : '🔇 Âm thanh: Tắt';
    }

    function playFunnySound(isCorrect) {
        if (!soundEnabled) return;
        initAudio();
        const now = audioCtx.currentTime;

        if (isCorrect) {
            // 3 hiệu ứng âm thanh ĐÚNG vui nhộn, bất ngờ
            const mode = Math.floor(Math.random() * 3);
            if (mode === 0) {
                // Kiểu 1: Chuông thưởng liên hoàn (Victory Chime)
                const freqs = [523.25, 659.25, 783.99, 1046.5, 1318.5];
                freqs.forEach((f, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + idx * 0.055);
                    gain.gain.setValueAtTime(0.22, now + idx * 0.055);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.18);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.055);
                    osc.stop(now + idx * 0.055 + 0.18);
                });
            } else if (mode === 1) {
                // Kiểu 2: Còi trượt vút lên bất ngờ (Funny Slide Up + Ding)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(1400, now + 0.25);
                gain.gain.setValueAtTime(0.24, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            } else {
                // Kiểu 3: Kèn Fanfare 8-bit vui nhộn
                const notes = [587.33, 587.33, 587.33, 783.99, 987.77];
                const starts = [0, 0.07, 0.14, 0.21, 0.33];
                const lens = [0.05, 0.05, 0.05, 0.1, 0.25];
                notes.forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(f, now + starts[i]);
                    gain.gain.setValueAtTime(0.12, now + starts[i]);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + starts[i] + lens[i]);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + starts[i]);
                    osc.stop(now + starts[i] + lens[i]);
                });
            }
        } else {
            // 2 hiệu ứng âm thanh SAI hài hước ("Ò e í e" / "Tụt dây cót")
            const mode = Math.floor(Math.random() * 2);
            if (mode === 0) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(280, now);
                osc.frequency.linearRampToValueAtTime(210, now + 0.16);
                osc.frequency.linearRampToValueAtTime(125, now + 0.4);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.44);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.44);
            } else {
                const freqs = [260, 240, 210, 150];
                freqs.forEach((f, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + idx * 0.09);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.09);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.09);
                    osc.stop(now + idx * 0.09 + 0.09);
                });
            }
        }
    }

                correctIndex: 0,
                explanation: "Trong chuyển động thẳng nhanh dần đều không vận tốc đầu dưới tác dụng của lực kéo $F$ không đổi: vận tốc tức thời ở cuối giai đoạn là $v = at$, còn vận tốc trung bình là $v_{\\text{tb}} = \\dfrac{s}{t} = \\dfrac{\\frac{1}{2}at^2}{t} = \\dfrac{v}{2}$. Vì $\\mathcal{P}_t = F \\cdot v$ và $\\mathcal{P}_{\\text{tb}} = F \\cdot v_{\\text{tb}}$, nên tỉ số $\\dfrac{\\mathcal{P}_t}{\\mathcal{P}_{\\text{tb}}} = \\dfrac{v}{v/2} = 2$. (Cụ thể: $a = 2\\text{ m/s}^2 \\Rightarrow F = F_{\\text{ms}} + ma = 800\\text{ N} \\Rightarrow \\mathcal{P}_t = 8000\\text{ W}, \\mathcal{P}_{\\text{tb}} = 4000\\text{ W}$)."
            },
            {
                id: "B24_L3_2",
                topic: "Công suất ô tô lên dốc có ma sát",
                question: "Một ô tô khối lượng $m = 1{,}5\\text{ tấn} = 1500\\text{ kg}$ chuyển động **thẳng đều** lên một dốc nghiêng có $\\sin\\alpha = 0{,}06$ (và $\\cos\\alpha \\approx 1$) với tốc độ $v = 54\\text{ km/h}$. Hệ số ma sát toàn phần trên mặt dốc là $\\mu = 0{,}04$, lấy $g = 10\\text{ m/s}^2$. Công suất của động cơ ô tô khi lên dốc là:",
                svg: SVGs.inclineCarUp,
                options: [
                    "$22{,}5\\text{ kW}$",
                    "$13{,}5\\text{ kW}$",
                    "$9{,}0\\text{ kW}$",
                    "$45{,}0\\text{ kW}$"
                ],
                correctIndex: 0,
                explanation: "Đổi $v = 54\\text{ km/h} = 15\\text{ m/s}$. Vì xe lên dốc thẳng đều nên lực kéo cân bằng với thành phần trọng lực dọc dốc và lực ma sát: $F_k = mg\\sin\\alpha + \\mu mg\\cos\\alpha = 1500 \\cdot 10 \\cdot (0{,}06 + 0{,}04) = 1500\\text{ N}$. Công suất động cơ: $\\mathcal{P} = F_k \\cdot v = 1500 \\cdot 15 = 22\\,500\\text{ W} = 22{,}5\\text{ kW}$."
            },
            {
                id: "B24_L3_3",
                topic: "Bài toán không đổi Công suất khi lên dốc và chạy ngang",
                question: "Một ô tô chạy thẳng đều trên đường nằm ngang với tốc độ $v_1 = 72\\text{ km/h}$ khi động cơ phát ra công suất cực đại. Biết lực cản trên đường luôn bằng $0{,}05$ lần trọng lượng xe ($F_c = 0{,}05P$). Nếu xe giữ nguyên công suất cực đại đó để leo đều lên một dốc có $\\sin\\alpha = 0{,}05$ (với lực cản không đổi) thì tốc độ tối đa $v_2$ của xe trên dốc là:",
                svg: SVGs.inclineCarUp,
                options: [
                    "$36\\text{ km/h}$",
                    "$54\\text{ km/h}$",
                    "$48\\text{ km/h}$",
                    "$24\\text{ km/h}$"
                ],
                correctIndex: 0,
                explanation: "Trên đường ngang: $F_1 = F_c = 0{,}05P$. Khi lên dốc đều: $F_2 = F_c + P\\sin\\alpha = 0{,}05P + 0{,}05P = 0{,}10P = 2F_1$. Vì công suất cực đại không đổi: $\\mathcal{P}_{\\max} = F_1 v_1 = F_2 v_2 \\Rightarrow v_2 = \\dfrac{F_1}{F_2}v_1 = \\dfrac{72}{2} = 36\\text{ km/h}$."
            },
            {
                id: "B24_L3_4",
                topic: "Hiệu suất kéo vật trên mặt phẳng nghiêng có ma sát",
                question: "Dùng một tời điện để kéo đều một thùng hàng khối lượng $m = 100\\text{ kg}$ trượt lên mặt phẳng nghiêng góc $\\alpha = 30^\\circ$ bằng lực kéo song song với mặt dốc. Biết hệ số ma sát trượt giữa thùng và mặt dốc là $\\mu = \\dfrac{1}{4\\sqrt{3}}$, lấy $g = 10\\text{ m/s}^2$. Hiệu suất của mặt phẳng nghiêng này là:",
                svg: SVGs.inclineCarUp,
                options: [
                    "$80\\%$",
                    "$75\\%$",
                    "$85\\%$",
                    "$60\\%$"
                ],
                correctIndex: 0,
                explanation: "Trên chiều dài dốc $s$: Công có ích nâng vật lên cao là $A_{\\text{ích}} = P \\cdot h = mg s \\sin 30^\\circ = 0{,}5 mgs$. Công của lực ma sát hao phí: $A_{\\text{hp}} = \\mu mg\\cos 30^\\circ \\cdot s = \\dfrac{1}{4\\sqrt{3}} \\cdot \\dfrac{\\sqrt{3}}{2} mgs = 0{,}125 mgs$. Công toàn phần: $A_{\\text{tp}} = A_{\\text{ích}} + A_{\\text{hp}} = 0{,}625 mgs$. Hiệu suất: $H = \\dfrac{0{,}5}{0{,}625} \\cdot 100\\% = 80\\%$."
            },
            {
                id: "B24_L3_5",
                topic: "Bài toán thực tế Nhà máy thủy điện & Hiệu suất",
                question: "Tại một trạm thủy điện nhỏ, nước từ hồ chứa ở độ cao $h = 25\\text{ m}$ đổ xuống làm quay tuabin máy phát điện với lưu lượng $Q = 120\\text{ m}^3/\\text{phút}$. Biết khối lượng riêng của nước là $\\rho = 1000\\text{ kg/m}^3$, gia tốc trọng trường $g = 10\\text{ m/s}^2$ và hiệu suất phát điện đạt $H = 80\\%$. Công suất điện có ích mà trạm phát ra là:",
                svg: SVGs.energySankey,
                options: [
                    "$400\\text{ kW}$",
                    "$500\\text{ kW}$",
                    "$300\\text{ kW}$",
                    "$24\\,000\\text{ kW}$"
                ],
                correctIndex: 0,
                explanation: "Trong mỗi giây ($t = 1\\text{ s}$), thể tích nước đổ xuống là $V = \\dfrac{120}{60} = 2\\text{ m}^3$, ứng với khối lượng nước $m = \\rho V = 2000\\text{ kg}$. Công suất toàn phần của dòng nước: $\\mathcal{P}_{\\text{tp}} = \\dfrac{mgh}{t} = 2000 \\cdot 10 \\cdot 25 = 500\\,000\\text{ W} = 500\\text{ kW}$. Công suất điện có ích: $\\mathcal{P}_{\\text{ích}} = H \\cdot \\mathcal{P}_{\\text{tp}} = 0{,}8 \\cdot 500 = 400\\text{ kW}$."
            }
        ]
    };

    // ==================== QUẢN LÝ TRẠNG THÁI, TRỘN ĐỀ & KIỂM SOÁT MỞ KHÓA ====================
    let currentLevel = 1;
    let level1PerfectCount = 0;
    let unlockedLevels = { 1: true, 2: false, 3: false };
    let activeQuestions = [];
    let answeredMap = {};
    let correctCount = 0;

    function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    }

    function showToast(msg) {
        const toast = document.getElementById('toast-msg');
        toast.textContent = msg;
        toast.style.display = 'block';
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => {
            toast.style.display = 'none';
        }, 3500);
    }

    function updateProgressUI() {
        for (let i = 1; i <= 3; i++) {
            const starEl = document.getElementById(`star-${i}`);
            if (i <= level1PerfectCount) {
                starEl.classList.add('earned');
            } else {
                starEl.classList.remove('earned');
            }
        }
        document.getElementById('pass-text').textContent = `(${level1PerfectCount}/3 lần)`;

        const tab2 = document.getElementById('tab-2');
        const tab3 = document.getElementById('tab-3');

        if (unlockedLevels[2]) {
            tab2.classList.remove('locked');
            tab2.innerHTML = '📗 Cấp độ 2: 7-8 điểm (5 câu)';
        }
        if (unlockedLevels[3]) {
            tab3.classList.remove('locked');
            tab3.innerHTML = '📕 Cấp độ 3: 9-10 điểm (5 câu)';
        }

        const total = activeQuestions.length;
        document.getElementById('score-display').textContent = `Đúng: ${correctCount} / ${total} câu`;
    }

    function switchLevel(lvl) {
        if (!unlockedLevels[lvl]) {
            playFunnySound(false);
            showToast(`🔒 Học sinh cần làm đúng 12/12 câu Cấp độ 1 đủ 3 lần (hiện tại: ${level1PerfectCount}/3) mới được mở khóa!`);
            return;
        }
        currentLevel = lvl;
        document.querySelectorAll('.level-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx + 1 === lvl);
        });
        loadLevelQuestions(lvl);
    }

    function restartCurrentLevel() {
        loadLevelQuestions(currentLevel);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast('🔄 Đã trộn ngẫu nhiên thứ tự câu hỏi và vị trí các đáp án!');
    }

    function teacherUnlockAll() {
        level1PerfectCount = 3;
        unlockedLevels[2] = true;
        unlockedLevels[3] = true;
        updateProgressUI();
        showToast('🔓 Đã mở khóa tất cả các cấp độ (Chế độ Giáo viên)!');
    }

    function loadLevelQuestions(lvl) {
        answeredMap = {};
        correctCount = 0;

        const rawList = QUESTION_BANK[lvl];
        activeQuestions = shuffleArray(rawList).map(q => {
            const optionObjects = q.options.map((text, idx) => ({
                text,
                isCorrect: idx === q.correctIndex
            }));
            return {
                ...q,
                shuffledOptions: shuffleArray(optionObjects)
            };
        });

        renderQuestions();
        updateProgressUI();
    }

    function renderQuestions() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        const labels = ['A', 'B', 'C', 'D'];

        activeQuestions.forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'question-card';

            const svgHTML = q.svg ? `<div class="svg-container">${q.svg}</div>` : '';
            const optionsHTML = q.shuffledOptions.map((opt, optIdx) => `
                <button class="option-btn" id="btn-${qIndex}-${optIdx}" onclick="selectOption(${qIndex}, ${optIdx})">
                    <span class="option-label">${labels[optIdx]}</span>
                    <span class="option-content">${opt.text}</span>
                </button>
            `).join('');

            card.innerHTML = `
                <div class="question-header">
                    <span class="q-badge">Câu ${qIndex + 1} / ${activeQuestions.length}</span>
                    <span class="q-topic">${q.topic}</span>
                </div>
                <div class="q-text">${q.question}</div>
                ${svgHTML}
                <div class="options-grid">
                    ${optionsHTML}
                </div>
                <div class="feedback-box" id="feedback-${qIndex}"></div>
            `;

            container.appendChild(card);
        });

        if (window.renderMathInElement) {
            renderMathInElement(container, {
                delimiters: [
                    { left: "$$", right: "$$", display: true },
                    { left: "$", right: "$", display: false }
                ],
                throwOnError: false
            });
        }
    }

    function selectOption(qIndex, optIdx) {
        if (answeredMap[qIndex] !== undefined) return;
        answeredMap[qIndex] = optIdx;

        const q = activeQuestions[qIndex];
        const chosen = q.shuffledOptions[optIdx];
        const isCorrect = chosen.isCorrect;

        playFunnySound(isCorrect);

        q.shuffledOptions.forEach((opt, idx) => {
            const btn = document.getElementById(`btn-${qIndex}-${idx}`);
            btn.disabled = true;
            if (opt.isCorrect) {
                btn.classList.add('correct');
            } else if (idx === optIdx && !isCorrect) {
                btn.classList.add('wrong');
            }
        });

        const fb = document.getElementById(`feedback-${qIndex}`);
        if (isCorrect) {
            correctCount++;
            fb.className = 'feedback-box show correct';
            fb.innerHTML = `<strong>🎉 Chính xác! Quá đỉnh!</strong><br>${q.explanation}`;
        } else {
            fb.className = 'feedback-box show wrong';
            fb.innerHTML = `<strong>😲 Hơi tiếc một chút! Cùng xem lại lời giải nhé:</strong><br>${q.explanation}`;
        }

        if (window.renderMathInElement) {
            renderMathInElement(fb, {
                delimiters: [
                    { left: "$$", right: "$$", display: true },
                    { left: "$", right: "$", display: false }
                ],
                throwOnError: false
            });
        }

        updateProgressUI();
        checkLevelCompletion();
    }

    function checkLevelCompletion() {
        const total = activeQuestions.length;
        const answeredCount = Object.keys(answeredMap).length;

        if (answeredCount === total) {
            if (currentLevel === 1) {
                if (correctCount === total) {
                    level1PerfectCount = Math.min(3, level1PerfectCount + 1);
                    if (level1PerfectCount >= 3) {
                        unlockedLevels[2] = true;
                        unlockedLevels[3] = true;
                        updateProgressUI();
                        showToast('🏆 Xuất sắc! Em đã hoàn thành 12/12 câu Cấp độ 1 đủ 3 lần. Cấp độ 2 và Cấp độ 3 đã MỞ KHÓA!');
                    } else {
                        updateProgressUI();
                        showToast(`🌟 Tuyệt vời (12/12)! Đã tích lũy ${level1PerfectCount}/3 lần. Hãy bấm "Đảo câu hỏi & Làm lại" thêm ${3 - level1PerfectCount} lần nữa để mở khóa Cấp 2 & 3!`);
                    }
                } else {
                    showToast(`💡 Em đúng ${correctCount}/12 câu. Cần đúng tuyệt đối 12/12 câu mới được tính 1 lần qua vòng. Bấm "Đảo câu hỏi & Làm lại" để thử lại nhé!`);
                }
            } else {
                showToast(`🎯 Hoàn thành Cấp độ ${currentLevel}! Kết quả: Đúng ${correctCount}/${total} câu.`);
            }
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadLevelQuestions(1);
        setTimeout(() => {
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        { left: "$$", right: "$$", display: true },
                        { left: "$", right: "$", display: false }
                    ],
                    throwOnError: false
                });
            }
        }, 300);
    });
</script>
